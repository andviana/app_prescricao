{% extends 'base.html' %}

{% block content %}
<div class="bg-white shadow rounded-lg p-6 max-w-2xl mx-auto">
    <div class="mb-6 border-b pb-4">
        <h2 class="text-2xl font-semibold text-gray-800">Parâmetros do Sistema</h2>
        <p class="text-sm text-gray-500 mt-1">Configure os dados do cabeçalho utilizados na geração dos PDFs das prescrições.</p>
    </div>

    <form method="POST" action="{{ url_for('configuracoes.configurar') }}">
        <div class="space-y-4">
            <div>
                <label for="nome_empresa" class="block text-sm font-medium text-gray-700">Nome da Empresa / Hospital <span class="text-red-500">*</span></label>
                <input type="text" name="nome_empresa" id="nome_empresa" value="{{ config.nome_empresa }}" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div>
                <label for="telefone" class="block text-sm font-medium text-gray-700">Telefone</label>
                <input type="text" name="telefone" id="telefone" value="{{ config.telefone or '' }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="(00) 0000-0000">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
                <input type="email" name="email" id="email" value="{{ config.email or '' }}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="contato@empresa.com">
            </div>
        </div>

        <div class="flex justify-end space-x-3 border-t pt-4 mt-6">
            <a href="{{ url_for('main.dashboard') }}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Cancelar
            </a>
            <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Salvar Configurações
            </button>
        </div>
    </form>
</div>
{% endblock %}
